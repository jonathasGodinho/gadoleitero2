<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Pagina nao encontrada | Terra Roxa System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2ECC71;
            --dark-green: #27AE60;
            --darker-green: #1E8449;
            --navy-dark: #2C3E50;
            --bg-card: #FFFFFF;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #2C3E50 0%, #27AE60 50%, #1E8449 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .error-card {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            text-align: center;
        }
        .error-header {
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--dark-green) 100%);
            padding: 2.5rem 2rem;
            color: white;
        }
        .error-header .code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            opacity: 0.9;
        }
        .error-header .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .error-body {
            padding: 2rem;
        }
        .error-body h5 {
            color: var(--navy-dark);
            font-weight: 700;
        }
        .error-body p {
            color: #636E72;
            margin-bottom: 1.5rem;
        }
        .btn-home {
            background: linear-gradient(135deg, var(--dark-green) 0%, #40A190 100%);
            border: none;
            border-radius: 8px;
            padding: 10px 32px;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-header">
            <span class="icon">🔍</span>
            <div class="code">404</div>
        </div>
        <div class="error-body">
            <h5>Pagina nao encontrada</h5>
            <p>A pagina que voce procura nao existe ou foi removida.</p>
            <a href="/" class="btn-home">Voltar ao Inicio</a>
        </div>
    </div>
</body>
</html>
