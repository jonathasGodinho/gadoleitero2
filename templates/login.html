<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Terra Roxa System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(rgba(39, 174, 96, 0.85), rgba(30, 132, 73, 0.85)), 
                        url('https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
        }
        .login-card .card-body {
            padding: 2rem;
        }
        .btn-primary {
            background-color: #27AE60;
            border-color: #27AE60;
        }
        .btn-primary:hover {
            background-color: #1E8449;
            border-color: #1E8449;
        }
        .form-control:focus {
            border-color: #27AE60;
            box-shadow: 0 0 0 0.2rem rgba(39, 174, 96, 0.25);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <h3 style="color: #2C3E50;">🐄 Terra Roxa System</h3>
                <small class="text-muted">Entre com suas credenciais</small>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label" style="color: #2D3436;">Email</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: #2D3436;">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
            </form>
            <div class="text-center">
                <a href="/register" class="text-muted small">Não tem conta? Registre-se</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
