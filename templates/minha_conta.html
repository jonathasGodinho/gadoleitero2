{% extends "base.html" %}

{% block title %}Minha Conta - Terra Roxa System{% endblock %}
{% block page_title %}👤 Minha Conta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card">
            <div class="card-header bg-transparent">
                <h5 class="mb-0">✏️ Editar Dados</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" value="{{ current_user.nome or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nova Senha (deixe em branco para manter)</label>
                        <input type="password" name="nova_senha" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
